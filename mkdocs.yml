site_name: Cherif Zouaoui — Cybersecurity Portfolio
site_url: https://ZouCherif.github.io/portfolio/
site_description: Educational cybersecurity portfolio of Cherif Zouaoui — Blue Team, SOC, security infrastructure, Active Directory and authorized hands-on security labs.
copyright: Educational cybersecurity portfolio — offensive techniques are documented only from authorized lab and training environments.

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
      - Security Monitoring Lab: Projects/01-deploiement-siem-wazuh.md
      - Active Directory Attack & Defense Lab: Projects/02-active-directory-security-lab.md
      - Bitcoin / PiM Optimization: Projects/03-bitcoin-pim.md
  - CTF Write-ups:
      - Retro: CTF/Retro.md
      - Attacktive Directory: CTF/attacktive-directory.md
      - CMSpit: CTF/CMSpit.md
      - JacobTheBoss: CTF/JacobTheBoss.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
