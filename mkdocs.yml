site_name: Cherif Zouaoui — Cybersecurity Portfolio
site_url: https://ZouCherif.github.io/portfolio/
site_description: Cybersecurity portfolio of Cherif Zouaoui — Blue Team, security infrastructure, SOC, Active Directory and technical security projects.

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
      - Security Monitoring Lab: Projects/01-deploiement-siem-wazuh.md
      - Bitcoin / PiM Optimization: Projects/02-bitcoin-pim.md
  - CTF Write-ups:
      - Attacktive Directory: CTF/attacktive-directory.md
      - CMSpit: CTF/CMSpit.md
      - JacobTheBoss: CTF/JacobTheBoss.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
